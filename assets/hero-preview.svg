        <rect x="12" y="48" width="200" height="7" rx="3.5" fill="#f59e0b" />
        <text x="12" y="68" class="mono" font-size="10" fill="#64748b">Resets: <tspan fill="#38bdf8">in 5d 12h 25m</tspan></text>

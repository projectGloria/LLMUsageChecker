          <text x="274" y="22" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#10b981">100.0% left</text>
          <rect x="12" y="32" width="262" height="8" rx="4" fill="#1e293b" />
          <rect x="12" y="32" width="0" height="8" rx="4" fill="#10b981" />

        <text x="50" y="40" class="mono" font-size="10" fill="#64748b">Token: ~/.codex/auth.json</text>

        <!-- Metric 1: 5-Hour Session -->
        <g transform="translate(14, 58)">
          <rect width="286" height="90" rx="8" fill="#141a29" stroke="#1f273d" />
